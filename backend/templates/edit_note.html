

<!DOCTYPE html>
<html>

<head>

    <title>Edit Note</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

    <div class="form-container">

        <h1>Edit Note</h1>

        <form method="POST">

            <input type="text"
                   name="title"
                   value="{{ note[1] }}">

            <textarea name="content">{{ note[2] }}</textarea>

            <button type="submit">
                Update Note
            </button>

        </form>

    </div>

</body>


</html>
