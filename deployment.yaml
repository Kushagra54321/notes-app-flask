apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:

    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-container
          image: notes_web_app-flask-app:latest
          imagePullPolicy: Always

          env:
            - name: DB_HOST
              value: "mysql-db"
            
            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: DB_NAME
              value: "notes_app"
            
            - name: SECRET_KEY
              value: "mysecretkey"

          ports:
            - containerPort: 5000